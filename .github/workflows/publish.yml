name: Publish to GitHub Pages

# main push · 매일 11:00 KST(본 사이트 10:15 일일 발행 뒤) · 수동 실행.
# 선거 등급·시장가는 빌드 때마다 본 사이트 저장소에서 새로 받는다(scripts/fetch_election_data.py).
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        shell: Rscript {0}
        run: install.packages(c("rmarkdown", "knitr", "jsonlite", "dplyr", "gt", "readr", "htmltools"))
      - name: Fetch election data from us-elections-2026.github.io
        run: python3 scripts/fetch_election_data.py
      - name: Check data
        run: python3 scripts/check_korea_weekly.py
      - name: Render
        run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
